name: Test, build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages-ready: ${{ steps.pages.outputs.ready }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Test the simulation
        run: npm test
      - name: Build the static site
        run: npm run build
      - name: Upload the site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
      - name: Check Pages setup
        id: pages
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if source=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' 2>"$RUNNER_TEMP/pages-error"); then
            if [[ "$source" == "workflow" ]]; then
              echo 'ready=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif [[ "$(<"$RUNNER_TEMP/pages-error")" != *"HTTP 404"* ]]; then
            cat "$RUNNER_TEMP/pages-error" >&2
            exit 1
          fi
          echo 'ready=false' >> "$GITHUB_OUTPUT"
          echo '::notice::A repository admin or maintainer must select Settings > Pages > Source > GitHub Actions, then run this workflow again.'
          echo 'Tests and build passed. To publish, select **Settings → Pages → Source → GitHub Actions**, then run this workflow again from the Actions tab.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.pages-ready == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
